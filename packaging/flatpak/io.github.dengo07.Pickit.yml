app-id: io.github.dengo07.Pickit
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: pickit
finish-args:
  # Wayland: the Pickit window, and widgets as layer-shell surfaces where the compositor has it.
  - --socket=wayland
  # X11 too, even on Wayland: widgets fall back to X11 dock / keep-below windows (through
  # XWayland) on compositors without layer-shell, such as GNOME and Cinnamon.
  - --socket=x11
  - --share=ipc
  - --device=dri
  # Anthropic API, CDN fonts/libraries used by generated widgets.
  - --share=network
  # Widgets' approved shell commands and the Claude Code CLI run on the host
  # (via flatpak-spawn --host); the desktop daemon is started the same way.
  - --talk-name=org.freedesktop.Flatpak
  # Refresh widgets immediately on power changes, resume from sleep and network changes.
  - --system-talk-name=org.freedesktop.UPower
  - --system-talk-name=org.freedesktop.login1
  - --system-talk-name=org.freedesktop.NetworkManager
  # Start the desktop daemon at login so widgets survive reboots.
  - --filesystem=xdg-config/autostart:create
  # Widgets and settings live in the normal locations, shared with the AppImage/source versions.
  - --filesystem=xdg-data/pickit:create
  - --filesystem=xdg-config/pickit:create
modules:
  - python-deps.json

  # Wayland layer-shell for GTK 3: widgets in the desktop layer on KDE, Hyprland, Sway, COSMIC...
  - name: gtk-layer-shell
    buildsystem: meson
    config-opts:
      - -Dintrospection=true
      - -Dvapi=false
      - -Dexamples=false
      - -Ddocs=false
      - -Dtests=false
    sources:
      - type: archive
        url: https://github.com/wmww/gtk-layer-shell/archive/refs/tags/v0.10.1.tar.gz
        sha256: 88c3a3e0a5300532f3d368d5df64838a87f1fb85273f22d41df0a6b8d0ec59c6
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/gir-1.0

  - name: pickit
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/pickit
      - cp -r pickit /app/share/pickit/
      - install -Dm755 pickit.sh /app/bin/pickit
      - install -Dm644 pickit/data/io.github.dengo07.Pickit.desktop -t /app/share/applications
      - install -Dm644 pickit/data/io.github.dengo07.Pickit.svg -t /app/share/icons/hicolor/scalable/apps
      - install -Dm644 pickit/data/io.github.dengo07.Pickit.metainfo.xml -t /app/share/metainfo
      - install -Dm644 pickit/data/io.github.dengo07.Pickit.mime.xml /app/share/mime/packages/io.github.dengo07.Pickit.xml
    sources:
      - type: dir
        path: ../..
        skip:
          - build
          - dist
          - packaging
          - docs
          - tests
          - .git
          - .github
          - .flatpak-builder
      - type: script
        dest-filename: pickit.sh
        commands:
          - export PYTHONPATH=/app/share/pickit${PYTHONPATH:+:$PYTHONPATH}
          - exec python3 -m pickit "$@"
