[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pickit"
dynamic = ["version"]
description = "Describe a desktop widget in plain language and get it on your Linux desktop"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Deniz Ural" }]
requires-python = ">=3.10"
# PyGObject, GTK 3 and WebKit2GTK 4.1 come from the system (see README).
dependencies = []
keywords = ["widgets", "desktop", "linux", "gtk", "claude", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
]

[project.optional-dependencies]
api = ["anthropic>=1.8"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pickit = "pickit.__main__:main"

[project.urls]
Homepage = "https://github.com/dengobey/pickit"
Issues = "https://github.com/dengobey/pickit/issues"
Changelog = "https://github.com/dengobey/pickit/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "pickit.__version__" }

[tool.setuptools.packages.find]
include = ["pickit*"]

[tool.setuptools.package-data]
pickit = ["data/*", "prompts/*"]

[tool.ruff]
line-length = 115
target-version = "py310"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E402"]  # gi.require_version() must run before `from gi.repository import ...`

[tool.pytest.ini_options]
testpaths = ["tests"]
