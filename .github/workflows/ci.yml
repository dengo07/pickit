name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff pytest
      - run: ruff check .
      - run: pytest -q

  smoke:
    name: GTK smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK and WebKit
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 xvfb
      - name: Import every module and build the maker window
        run: |
          xvfb-run -a python3 - <<'PY'
          import os
          os.environ.setdefault("GDK_BACKEND", "x11")
          import pickit.app, pickit.daemon, pickit.widget_window
          from pickit.widget_window import WidgetView
          WidgetView()
          print("ok")
          PY
