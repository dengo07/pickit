name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-24.04   # sets the AppImage's glibc floor (2.39)
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 glib-networking \
            librsvg2-common libgdk-pixbuf2.0-bin libglib2.0-bin python3-pip rsync curl file
      - run: make appimage
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: dist/Pickit-x86_64.AppImage

  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          manifest-path: packaging/flatpak/io.github.dengo07.Pickit.yml
          bundle: Pickit.flatpak
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false
      # The builder leaves an OSTree repository in ./repo. Published on GitHub Pages, it
      # lets Pickit.flatpakref install with a double-click, and users get updates.
      # System-wide installs (what software centers do) refuse unsigned repositories,
      # so everything is signed with the key in the FLATPAK_GPG_PRIVATE_KEY secret; its
      # public half is packaging/flatpak/pickit.gpg (also embedded in the site files).
      - name: Sign the Flatpak repository
        shell: bash
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          # Report the exact failing command as a visible error annotation.
          trap 'echo "::error::Signing failed (exit $?) at: $BASH_COMMAND"' ERR
          set -eE
          if [ -z "$FLATPAK_GPG_PRIVATE_KEY" ]; then
            echo "::error::The FLATPAK_GPG_PRIVATE_KEY secret is not set (see docs/PACKAGING.md)."
            exit 1
          fi
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          gpg --version | head -1
          # Containers have no session agent; start one so secret keys can be imported.
          gpgconf --launch gpg-agent
          # Accept the ASCII-armored block or a single-line base64 encoding of it (safer to
          # paste), and tolerate Windows line endings and indentation added while pasting.
          KEYFILE="$GNUPGHOME/key.asc"
          printf '%s\n' "$FLATPAK_GPG_PRIVATE_KEY" | tr -d '\r' | sed 's/^[[:space:]]*//' > "$KEYFILE"
          if ! grep -q -- '-----BEGIN PGP PRIVATE KEY BLOCK-----' "$KEYFILE"; then
            tr -d '[:space:]' < "$KEYFILE" | base64 -d > "$KEYFILE.dec" 2>/dev/null || true
            mv "$KEYFILE.dec" "$KEYFILE"
          fi
          if ! grep -q -- '-----BEGIN PGP PRIVATE KEY BLOCK-----' "$KEYFILE" \
             || ! grep -q -- '-----END PGP PRIVATE KEY BLOCK-----' "$KEYFILE"; then
            echo "::error::FLATPAK_GPG_PRIVATE_KEY is not a complete private key ($(wc -l < "$KEYFILE") lines;\
           BEGIN marker: $(grep -c -- '-----BEGIN PGP PRIVATE' "$KEYFILE"), END marker: $(grep -c -- '-----END PGP PRIVATE' "$KEYFILE")).\
           Paste the single line printed by: base64 -w0 private-key.asc (see docs/PACKAGING.md)."
            exit 1
          fi
          gpg --batch --pinentry-mode loopback --passphrase '' --import "$KEYFILE"
          FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          if [ -z "$FPR" ]; then
            echo "::error::No secret key found in FLATPAK_GPG_PRIVATE_KEY. Paste the whole ASCII-armored block."
            exit 1
          fi
          EXPECTED=$(gpg --show-keys --with-colons packaging/flatpak/pickit.gpg | awk -F: '/^fpr/ {print $10; exit}')
          if [ "$FPR" != "$EXPECTED" ]; then
            echo "::error::Secret key $FPR does not match packaging/flatpak/pickit.gpg ($EXPECTED)."
            exit 1
          fi
          echo "Signing with $FPR"
          flatpak build-sign --gpg-sign="$FPR" --gpg-homedir="$GNUPGHOME" repo io.github.dengo07.Pickit master
          if flatpak repo --branches repo | grep -q "runtime/io.github.dengo07.Pickit.Debug/"; then
            flatpak build-sign --runtime --gpg-sign="$FPR" --gpg-homedir="$GNUPGHOME" repo io.github.dengo07.Pickit.Debug master
          fi
          flatpak build-update-repo --gpg-sign="$FPR" --gpg-homedir="$GNUPGHOME" --prune --generate-static-deltas repo
          # Offline bundle that still receives updates from the signed repository.
          flatpak build-bundle --gpg-sign="$FPR" --gpg-homedir="$GNUPGHOME" \
            --gpg-keys=packaging/flatpak/pickit.gpg \
            --repo-url=https://dengo07.github.io/pickit/repo/ \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo Pickit.flatpak io.github.dengo07.Pickit master
      - name: Assemble the GitHub Pages site (Flatpak repository + landing page)
        run: |
          mkdir -p site
          cp -r packaging/flatpak/site/. site/
          cp pickit/data/io.github.dengo07.Pickit.svg site/icon.svg
          cp docs/screenshots/maker.png site/maker.png
          mv repo site/repo
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: |
            Pickit.flatpak
            packaging/flatpak/site/Pickit.flatpakref

  pages:
    needs: flatpak
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  publish:
    needs: [appimage, flatpak, pages]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/Pickit-x86_64.AppImage
            artifacts/Pickit.flatpak
            artifacts/**/Pickit.flatpakref
          generate_release_notes: true
          body: |
            ## Install

            - **Flatpak (recommended):** download **Pickit.flatpakref** below and open it. Your software center opens with an Install button, and updates arrive automatically. Or run `flatpak install https://dengo07.github.io/pickit/Pickit.flatpakref`
            - **AppImage:** download **Pickit-x86_64.AppImage**, then right-click → Properties → Permissions → *Allow executing file as program*, and double-click it.
            - `Pickit.flatpak` is an offline bundle, for installing without internet access: `flatpak install Pickit.flatpak`
