name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-24.04   # sets the AppImage's glibc floor (2.39)
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 glib-networking \
            librsvg2-common libgdk-pixbuf2.0-bin libglib2.0-bin python3-pip rsync curl file
      - run: make appimage
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: dist/Pickit-x86_64.AppImage

  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          manifest-path: packaging/flatpak/io.github.dengo07.Pickit.yml
          bundle: Pickit.flatpak
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false
      # The builder leaves an OSTree repository in ./repo. Published on GitHub Pages, it
      # lets Pickit.flatpakref install with a double-click, and users get updates.
      - name: Assemble the GitHub Pages site (Flatpak repository + landing page)
        run: |
          flatpak build-update-repo --prune --generate-static-deltas repo
          mkdir -p site
          cp -r packaging/flatpak/site/. site/
          cp pickit/data/io.github.dengo07.Pickit.svg site/icon.svg
          cp docs/screenshots/maker.png site/maker.png
          mv repo site/repo
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: |
            Pickit.flatpak
            packaging/flatpak/site/Pickit.flatpakref

  pages:
    needs: flatpak
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  publish:
    needs: [appimage, flatpak, pages]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/Pickit-x86_64.AppImage
            artifacts/Pickit.flatpak
            artifacts/**/Pickit.flatpakref
          generate_release_notes: true
          body: |
            ## Install

            - **Flatpak (recommended):** download **Pickit.flatpakref** below and open it. Your software center opens with an Install button, and updates arrive automatically. Or run `flatpak install https://dengo07.github.io/pickit/Pickit.flatpakref`
            - **AppImage:** download **Pickit-x86_64.AppImage**, then right-click → Properties → Permissions → *Allow executing file as program*, and double-click it.
            - `Pickit.flatpak` is an offline bundle, for installing without internet access: `flatpak install Pickit.flatpak`
