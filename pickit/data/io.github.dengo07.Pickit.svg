  <rect x="8.75" y="8.75" width="110.5" height="110.5" rx="27.25" fill="none" stroke="#ffffff" stroke-opacity="0.13" stroke-width="1.5"/>

  <!-- ring gauge widget, with the spark (made by describing it) at its center -->
